# SonarCloud automatic analysis scope (read by SonarCloud; no secrets, no CI step).
# Everything is analysed as before, except that tests/ is test code: test doubles and fixtures there are run only by
# the test suites, never shipped or used as tooling, so Sonar applies its test rules to them instead of the
# vulnerability rules meant for product and script code. A file cannot be both, hence the exclusion.
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests
