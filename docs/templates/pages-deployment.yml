# INACTIVE TEMPLATE: documentation only; GitHub does not load workflows from docs/templates/.
# Owner activation requires separate publication authorization and the gates in docs/PAGES.md.
# Do not copy into .github/workflows/ as part of preparation.
name: Authorized Pages publication

on:
  workflow_dispatch:
    inputs:
      authorize_deployment:
        description: Owner has explicitly authorized publication of the reviewed commit
        type: boolean
        required: true
        default: false
      reviewed_commit:
        description: Full reviewed default-branch commit SHA, identical to this run SHA
        type: string
        required: true
        default: ''

permissions: {}

concurrency:
  group: pages-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.authorize_deployment && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.reviewed_commit == github.sha
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Install the pinned browser
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Verify project-path hosting and offline hashing
        run: node_modules/.bin/playwright test tests/e2e/pages-base-path.spec.ts --retries=0
        env:
          CI: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaltered-pages-review
          path: dist/web/
          if-no-files-found: error
          retention-days: 7
      - name: Package the verified site for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: dist/web/
          retention-days: 7

  deploy:
    needs: prepare
    if: needs.prepare.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.authorize_deployment && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.reviewed_commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    # Pre-create and protect this environment before activating this template.
    # Merely naming it here does not install required reviewers or branch restrictions.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the official artifact from this successful preparation run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
          preview: false
