# DIAGNOSTIC ONLY — do not merge. Controlled A/B of the native 2 GiB read stall on identical runners at the same time.
# Both arms run the unchanged memory gate (3 fixed attempts, retries 0, 540 s deadline, <200 MiB RSS, independent digest).
# Arm "baseline" restores the hash source of 0b448d8; arm "watchdog" keeps this branch's stall recovery.
name: DIAGNOSTIC read-stall A/B
on:
  pull_request:
    branches: [codex/read-stall-watchdog-20261027]
permissions:
  contents: read
jobs:
  memory:
    name: ${{ matrix.arm }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, watchdog]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore the 0b448d8 hash source (baseline arm only)
        if: matrix.arm == 'baseline'
        run: git checkout 0b448d887df89fab22f701810197e51285590e2b -- src/core/hash/stream.ts src/core/errors.ts tests/unit/hash.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/memory.spec.ts --repeat-each=3 --retries=0 --max-failures=1
        env:
          CI: "true"
          UNALTERED_BIG_BROWSER: "1"
