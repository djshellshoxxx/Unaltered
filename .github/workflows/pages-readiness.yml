name: Pages readiness artifact

# Preparation only: this workflow uploads a review artifact and never publishes a site.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Install the pinned browser
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Verify project-path hosting and offline hashing
        run: node_modules/.bin/playwright test tests/e2e/pages-base-path.spec.ts --retries=0
        env:
          CI: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaltered-pages-review
          path: dist/web/
          if-no-files-found: error
          retention-days: 7
