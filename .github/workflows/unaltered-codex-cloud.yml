name: Unaltered API-Funded Cloud Development
on:
  workflow_dispatch:
  schedule:
    - cron: '53 9 * * *'
permissions: {}
concurrency:
  group: unaltered-api-funded-cloud
  cancel-in-progress: false
jobs:
  develop:
    if: github.repository == 'djshellshoxxx/Unaltered'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      validation: ${{ steps.validate.outcome }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Capture trusted source base before agent execution
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test the trusted publication scope boundary
        run: python3 .github/scripts/test_cloud_scope_guard.py
      - name: Check key and pending cloud PRs
        id: gate
        env:
          KEY_EXISTS: ${{ secrets.A != '' || secrets.UNALTERED_OPENAI_API_KEY != '' || secrets.OPENAI_API_KEY != '' || secrets.PATCHTRACE_OPENAI_API_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$KEY_EXISTS" != true ]; then
            echo "::error::Repository Actions secret UNALTERED_OPENAI_API_KEY or OPENAI_API_KEY is missing"
            exit 1
          fi
          count="$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("codex/unaltered-cloud-"))] | length')"
          if [ "$count" -ge 1 ]; then
            echo 'run_agent=false' >> "$GITHUB_OUTPUT"
            echo 'Existing cloud PR; skipping new API spend.'
          else
            echo 'run_agent=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node 22
        if: steps.gate.outputs.run_agent == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        if: steps.gate.outputs.run_agent == 'true'
        run: npm ci --ignore-scripts
      - name: Run API-funded Codex
        if: steps.gate.outputs.run_agent == 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.A || secrets.UNALTERED_OPENAI_API_KEY || secrets.OPENAI_API_KEY || secrets.PATCHTRACE_OPENAI_API_KEY }}
          permission-profile: ":workspace"
          output-file: unaltered-codex-report.txt
          prompt: |
            Work only on djshellshoxxx/Unaltered, a client-side OpenTimestamps
            file-stamping/verifying app. Inspect current main, active GitHub PRs
            (especially #39 if still pending), README, CONTRIBUTING.md,
            docs/TODO.md, docs/COMPLETION_STATUS.md, docs/OPSEC.md and specs.
            Implement ONE unowned accepted gap with test-first regression
            evidence and focused validation. Don't redo another branch's work.
            Only modify src/, tests/, docs/ and scripts/, excluding
            scripts/build.mjs, docs/OPSEC.md, docs/SPEC.md, docs/RELEASE.md,
            all src/core/net/, src/core/hash/ and src/core/ots/ code,
            cryptographic primitives, trust/host policy and release controls.
            Only scripts/parser-fuzz.mjs may change under scripts/.
            The trusted scope guard is authoritative and stricter than directory ownership.
            No changes to .github/, dependencies,
            third-party assets, release metadata or signing keys.
            Run npm run check after changes; preserve real failure evidence.
            Do not push, merge, sign, release, deploy, download user files,
            add external hosts, collect analytics, or make privacy claims
            beyond verified behavior. Produce exact test and handoff results.
      - name: Validate every committed, indexed and working-tree path
        if: steps.gate.outputs.run_agent == 'true'
        id: scope
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          # Run the guard from captured trusted Git bytes, never an agent-edited working-tree copy.
          git show "$BASE_SHA:.github/scripts/cloud_scope_guard.py" | python3 -I - "$BASE_SHA"
      - name: Run OPSEC, typecheck, lint and tests
        if: steps.gate.outputs.run_agent == 'true' && steps.scope.outcome == 'success'
        id: validate
        continue-on-error: true
        run: npm run check
      - name: Upload coding report
        if: always() && steps.gate.outputs.run_agent == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaltered-report-${{ github.run_id }}
          path: unaltered-codex-report.txt
          if-no-files-found: ignore
      - name: Package patch only after rechecking the trusted boundary
        if: steps.gate.outputs.run_agent == 'true' && steps.scope.outcome == 'success'
        id: package
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          # Validation runs changed code, so check again after it has finished.
          git show "$BASE_SHA:.github/scripts/cloud_scope_guard.py" | python3 -I - "$BASE_SHA"
          git reset --soft "$BASE_SHA"
          git add -A -- src tests docs scripts
          git show "$BASE_SHA:.github/scripts/cloud_scope_guard.py" | python3 -I - "$BASE_SHA"
          if git diff --cached --quiet "$BASE_SHA"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary "$BASE_SHA" > unaltered-changes.patch
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload patch
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaltered-patch-${{ github.run_id }}
          path: unaltered-changes.patch
          if-no-files-found: error
  publish:
    needs: develop
    if: needs.develop.result == 'success' && needs.develop.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Refuse a different publication base
        env:
          BASE_SHA: ${{ needs.develop.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unaltered-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/unaltered-staging
      - name: Apply patch as data and revalidate in the privileged checkout
        env:
          BASE_SHA: ${{ needs.develop.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --check --index --binary "$RUNNER_TEMP/unaltered-staging/unaltered-changes.patch"
          git apply --index --binary "$RUNNER_TEMP/unaltered-staging/unaltered-changes.patch"
          # --index includes new/deleted paths; the guard also independently reads untracked/mode/symlink state.
          git show "$BASE_SHA:.github/scripts/cloud_scope_guard.py" | python3 -I - "$BASE_SHA"
      - name: Open review PR
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.UNALTERED_GITHUB_TOKEN || github.token }}
          branch: codex/unaltered-cloud-${{ github.run_id }}
          base: main
          add-paths: |
            src
            tests
            docs
            scripts
          title: 'codex: Unaltered cloud checkpoint ${{ github.run_id }}'
          commit-message: 'fix: Unaltered cloud checkpoint'
          body: |
            API-funded development run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Local validation: ${{ needs.develop.outputs.validation }}.
            Trusted source base: ${{ needs.develop.outputs.base_sha }}.
            Require review and exact-head CI; no automatic merge, release or deployment.
          draft: true
          delete-branch: true
      - name: Dispatch full CI
        if: steps.pr.outputs.pull-request-branch != ''
        env:
          GH_TOKEN: ${{ secrets.UNALTERED_GITHUB_TOKEN || github.token }}
          REF: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --ref "$REF"
