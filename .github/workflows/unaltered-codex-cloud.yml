name: Unaltered API-Funded Cloud Development
on:
  workflow_dispatch:
  schedule:
    - cron: '53 9,21 * * *'
permissions: {}
concurrency:
  group: unaltered-api-funded-cloud
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'djshellshoxxx/Unaltered'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Integrate only qualified Unaltered cloud PRs
        env:
          GH_TOKEN: ${{ secrets.UNALTERED_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq \
            '.[] | select(.head.ref | startswith("codex/unaltered-cloud-")) | select(.head.repo.full_name == "djshellshoxxx/Unaltered") | select(.user.login == "github-actions[bot]" or .user.login == "djshellshoxxx") | select(.draft == false) | .number' |
          while IFS= read -r number; do
            [ -n "$number" ] || continue
            sha="$(gh pr view "$number" --json headRefOid --jq '.headRefOid')"
            checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100")"
            ready=true
            for name in 'Secret scan (verified Gitleaks release)' 'Identity and metadata leak check' 'Typecheck, lint, unit tests, reproducible build (Linux)' 'Windows build and tests' 'macOS build, tests, and package checksums' 'Linux, Windows, and macOS builds are byte-identical' 'End-to-end (chromium, CSP and accessibility)' 'End-to-end (firefox, CSP and accessibility)' 'End-to-end (webkit, CSP and accessibility)' 'Browser 2 GiB memory acceptance (Chromium)' 'Differential tests against the reference OpenTimestamps client'; do
              result="$(printf '%s' "$checks" | jq -r --arg name "$name" '([.check_runs[] | select(.name == $name)] | sort_by(.started_at) | last | .conclusion) // "missing"')"
              if [ "$result" != success ]; then
                echo "PR #$number waiting for $name ($result)"
                ready=false
              fi
            done
            if [ "$ready" != true ]; then continue; fi
            gh pr merge "$number" --squash --delete-branch --match-head-commit "$sha" ||
              echo "::warning::PR #$number blocked by GitHub merge requirements"
          done
  develop:
    needs: integrate
    if: github.repository == 'djshellshoxxx/Unaltered'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      validation: ${{ steps.validate.outcome }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Capture validated source base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check key and pending cloud PRs
        id: gate
        env:
          KEY_EXISTS: ${{ secrets.A != '' || secrets.UNALTERED_OPENAI_API_KEY != '' || secrets.OPENAI_API_KEY != '' || secrets.PATCHTRACE_OPENAI_API_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$KEY_EXISTS" != true ]; then
            echo "::error::Repository Actions secret A, UNALTERED_OPENAI_API_KEY, OPENAI_API_KEY or PATCHTRACE_OPENAI_API_KEY is missing"
            exit 1
          fi
          count="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq \
            '.[] | select(.head.ref | startswith("codex/unaltered-cloud-")) | select(.head.repo.full_name == "djshellshoxxx/Unaltered") | select(.user.login == "github-actions[bot]" or .user.login == "djshellshoxxx") | .number' | wc -l)"
          if [ "$count" -ge 1 ]; then
            echo 'run_agent=false' >> "$GITHUB_OUTPUT"
            echo 'Existing cloud PR; skipping new API spend.'
          else
            echo 'run_agent=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node 22
        if: steps.gate.outputs.run_agent == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        if: steps.gate.outputs.run_agent == 'true'
        run: npm ci --ignore-scripts
      - name: Run API-funded Codex
        if: steps.gate.outputs.run_agent == 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.A || secrets.UNALTERED_OPENAI_API_KEY || secrets.OPENAI_API_KEY || secrets.PATCHTRACE_OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          output-file: unaltered-codex-report.txt
          prompt: |
            Work only on djshellshoxxx/Unaltered, a client-side OpenTimestamps
            file-stamping/verifying app. Inspect current main, active GitHub PRs
            (especially #39 if still pending), README, CONTRIBUTING.md,
            docs/TODO.md, docs/COMPLETION_STATUS.md, docs/OPSEC.md and specs.
            Continue unfinished backlog features through ONE unowned accepted
            gap per run with test-first regression
            evidence and focused validation. Don't redo another branch's work.
            Human-only testing must not stop independently testable tasks.
            Only modify src/, tests/, docs/ and scripts/, excluding
            scripts/build.mjs, docs/OPSEC.md, docs/SPEC.md, docs/RELEASE.md,
            trust and host policies. No changes to .github/, dependencies,
            third-party assets, release metadata or signing keys.
            Run npm run check after changes; preserve real failure evidence.
            Do not push, merge, sign, release, deploy, download user files,
            add external hosts, collect analytics, or make privacy claims
            beyond verified behavior. Produce exact test and handoff results.
      - name: Validate modified paths
        if: steps.gate.outputs.run_agent == 'true'
        id: scope
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              src/*|tests/*|docs/*|scripts/*|unaltered-codex-report.txt) ;;
              *) echo "::error::Disallowed path: $file"; exit 1 ;;
            esac
            case "$file" in
              scripts/build.mjs|docs/OPSEC.md|docs/SPEC.md|docs/RELEASE.md|docs/DECISIONS.md|*secret*|*credential*|*.env*)
                echo "::error::Protected path: $file"; exit 1 ;;
            esac
          done < <({ git diff --name-only "${{ steps.base.outputs.sha }}" --; git ls-files -o --exclude-standard; } | sort -u)
      - name: Run OPSEC, typecheck, lint and tests
        if: steps.gate.outputs.run_agent == 'true' && steps.scope.outcome == 'success'
        id: validate
        continue-on-error: true
        run: npm run check
      - name: Upload coding report
        if: always() && steps.gate.outputs.run_agent == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaltered-report-${{ github.run_id }}
          path: unaltered-codex-report.txt
          if-no-files-found: ignore
      - name: Package patch
        if: steps.gate.outputs.run_agent == 'true' && steps.scope.outcome == 'success'
        id: package
        run: |
          set -euo pipefail
          git reset --soft "${{ steps.base.outputs.sha }}"
          git add -A -- src tests docs scripts
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary > unaltered-changes.patch
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload patch
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaltered-patch-${{ github.run_id }}
          path: unaltered-changes.patch
          if-no-files-found: error
  publish:
    needs: develop
    if: needs.develop.result == 'success' && needs.develop.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Refuse publication on a different main commit
        env:
          BASE_SHA: ${{ needs.develop.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || {
            echo "::error::Main advanced after validation; refusing stale publication"
            exit 1
          }
      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unaltered-patch-${{ github.run_id }}
          path: unaltered-staging
      - name: Apply patch as data
        run: |
          git apply --check --binary unaltered-staging/unaltered-changes.patch
          git apply --binary unaltered-staging/unaltered-changes.patch
      - name: Open review PR
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.UNALTERED_GITHUB_TOKEN || github.token }}
          branch: codex/unaltered-cloud-${{ github.run_id }}
          base: main
          add-paths: |
            src
            tests
            docs
            scripts
          title: 'codex: Unaltered cloud checkpoint ${{ github.run_id }}'
          commit-message: 'fix: Unaltered cloud checkpoint'
          body: |
            API-funded development run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Local validation: ${{ needs.develop.outputs.validation }}.
            Require review and exact-head CI; no release or deployment.
          draft: ${{ needs.develop.outputs.validation != 'success' }}
          delete-branch: true
      - name: Dispatch full CI
        if: steps.pr.outputs.pull-request-branch != ''
        env:
          GH_TOKEN: ${{ secrets.UNALTERED_GITHUB_TOKEN || github.token }}
          REF: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --ref "$REF"
