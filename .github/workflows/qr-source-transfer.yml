name: Apply locally qualified QR integration

on:
  push:
    branches: [chatgpt/qr-recovery-favicon-integration-20261108]
    paths: [docs/qr-existing.patch]

permissions: {}

concurrency:
  group: qr-source-transfer
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    if: github.repository == 'djshellshoxxx/Unaltered' && github.ref == 'refs/heads/chatgpt/qr-recovery-favicon-integration-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and apply the exact locally qualified source patch
        shell: bash
        run: |
          echo '9e726d5211b40a6afd1eb419f6ce19f5c3fb9e085f358f2266115ea7e5e5f593  docs/qr-existing.patch' | sha256sum --check -
          git apply --index --check --whitespace=nowarn docs/qr-existing.patch
          git apply --index --whitespace=nowarn docs/qr-existing.patch
          git rm docs/qr-existing.patch .github/workflows/qr-source-transfer.yml .github/workflows/qr-local-qualification.yml
      - name: Commit the source to the integration branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/chatgpt/qr-recovery-favicon-integration-20261108
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate archival QR image recovery, print qualification and favicon'
          gh auth setup-git
          git push origin HEAD:refs/heads/chatgpt/qr-recovery-favicon-integration-20261108
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
