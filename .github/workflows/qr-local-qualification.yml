name: QR local qualification snapshot

on:
  pull_request:
    paths:
      - .github/workflows/qr-local-qualification.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Archive tracked source and locked dependencies for isolated reproduction
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/unaltered-qualification/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/unaltered-qualification/source"
          cp -a node_modules "$RUNNER_TEMP/unaltered-qualification/source/node_modules"
          tar -czf "$RUNNER_TEMP/unaltered-qualification.tgz" -C "$RUNNER_TEMP/unaltered-qualification" source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaltered-qualification-snapshot
          path: ${{ runner.temp }}/unaltered-qualification.tgz
          retention-days: 1
          if-no-files-found: error
