name: QR local qualification snapshot

on:
  pull_request:
    paths:
      - .github/workflows/qr-local-qualification.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Archive pinned public inputs for isolated reproduction
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/unaltered-qr-inputs"
          git fetch --no-tags --depth=1 origin cb703a4703dc49ec20c65f19f90bbcc6e68b27cf
          git archive FETCH_HEAD -o "$RUNNER_TEMP/unaltered-qr-inputs/qr-baseline.tar"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/unaltered-qr-inputs" jsqr@1.4.0
          npm view jsqr@1.4.0 dist --json > "$RUNNER_TEMP/unaltered-qr-inputs/jsqr-dist.json"
          tar -czf "$RUNNER_TEMP/unaltered-qr-inputs.tgz" -C "$RUNNER_TEMP" unaltered-qr-inputs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaltered-qr-inputs
          path: ${{ runner.temp }}/unaltered-qr-inputs.tgz
          retention-days: 1
          if-no-files-found: error
