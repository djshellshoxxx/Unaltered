name: Release build

# Builds the release artefacts from a tag. Signing is a deliberate OFFLINE step (docs/RELEASE.md): this workflow never
# holds the release key. It publishes a DRAFT release with unsigned artefacts and SHA256SUMS for the maintainer to sign.
on:
  push:
    tags: ["v*"]
    # Branch pushes publish a numbered pre-release (v<version>-build.<run>) so builds are available before a tag is cut.
    branches: [main, "claude/project-completion-builds-vhvag8", "claude/peaceful-curie-u239yn"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/unaltered-*.html
            dist/unaltered-*.mjs
            dist/unaltered-*.zip
            dist/unaltered-*.tar.gz
            dist/SHA256SUMS

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-latest
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: release-macos-latest
          path: macos
      - name: Builds must be byte-identical across platforms
        run: |
          diff linux/SHA256SUMS windows/SHA256SUMS
          diff linux/SHA256SUMS macos/SHA256SUMS
      - name: Verify artefacts against SHA256SUMS
        run: cd linux && sha256sum -c SHA256SUMS
      - name: Create pre-release (unsigned)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ]; then TAG="$TAG_INPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"
          else TAG="v$(node -p "require('./package.json').version")-build.$GITHUB_RUN_NUMBER"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "$TAG" \
            --notes "Unsigned pre-release. Per-OS packages: Windows (.zip), Linux (.tar.gz), macOS (-macos.zip), plus the single-file offline .html and the Node CLI (.mjs). All are byte-identical across Linux, Windows and macOS builds; check them against SHA256SUMS. Release signing (SHA256SUMS.sig) is an offline maintainer step: docs/RELEASE.md." \
            linux/unaltered-*.html linux/unaltered-*.mjs linux/unaltered-*.zip linux/unaltered-*.tar.gz linux/SHA256SUMS
