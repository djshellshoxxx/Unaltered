name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default (OPSEC §5). Elevate per job only if ever needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opsec:
    name: Identity and metadata leak check
    runs-on: ubuntu-latest
    steps:
      # TODO(CI-2): pin actions by full commit SHA before the first release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run opsec-check
        run: bash scripts/opsec-check.sh

  build-test:
    name: Typecheck, lint, test, reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The job is a no-op until the toolchain exists (task M0-4 commits package-lock.json).
      # hashFiles() is not allowed in a job-level `if`, so detect the lockfile in a step.
      - name: Detect toolchain
        id: toolchain
        run: |
          if [ -f package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package-lock.json yet; skipping build and test steps."
          fi
      - uses: actions/setup-node@v4
        if: steps.toolchain.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install (no install scripts)
        if: steps.toolchain.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - name: Verify package signatures and provenance
        if: steps.toolchain.outputs.present == 'true'
        run: npm audit signatures
      - name: Typecheck, lint, test
        if: steps.toolchain.outputs.present == 'true'
        run: |
          npm run typecheck
          npm run lint
          npm run test
      - name: Build twice and compare (reproducibility gate)
        if: steps.toolchain.outputs.present == 'true'
        run: |
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/build1.sums
          rm -rf dist
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/build2.sums
          diff /tmp/build1.sums /tmp/build2.sums
