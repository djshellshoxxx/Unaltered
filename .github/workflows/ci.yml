name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default (OPSEC 5). Elevate per job only if ever needed.
permissions:
  contents: read

# A newer push or PR update supersedes the older run on the same ref (frees runner capacity; several earlier
# runs on PR 47 were superseded this way). Manual dispatches get their own group, so they never cancel and are
# never cancelled by a push or PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  # Never let dependency install scripts run in CI (OPSEC 3.2); .npmrc enforces the same locally.
  npm_config_ignore_scripts: "true"

jobs:
  secret-scan:
    name: Secret scan (verified Gitleaks release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run Gitleaks 8.30.1
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  opsec:
    name: Identity and metadata leak check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Official action tag targets verified through the GitHub API on 2026-10-22.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install media metadata inspector
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: Run opsec-check
        run: bash scripts/opsec-check.sh

  build-test:
    name: Typecheck, lint, unit tests, reproducible build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Verify package signatures and provenance
        run: npm audit signatures
      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm run test
      - name: Build twice and compare (reproducibility gate, SR-6)
        run: |
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/build1.sums
          rm -rf dist
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/build2.sums
          diff /tmp/build1.sums /tmp/build2.sums
      - name: Keep Linux checksums for the cross-platform comparison
        run: cp dist/SHA256SUMS linux-SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaltered-linux-build
          path: |
            dist/unaltered-*.html
            dist/unaltered-*.mjs
            dist/unaltered-*.tar.gz
            dist/unaltered-*.zip
            dist/SHA256SUMS
            linux-SHA256SUMS
          if-no-files-found: error

  e2e:
    name: End-to-end (${{ matrix.browser }}, CSP and accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The browser version is fixed by the pinned @playwright/test version in package-lock.json.
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # No retries: a passing retry would hide a failed attempt, including the SPEC "never blocked > 50 ms" check.
      - run: npm run test:e2e -- --retries=0
        env:
          CI: "true"
          UNALTERED_BROWSER: ${{ matrix.browser }}
      # Candidate PRs can qualify the Pages artifact before the standalone manual workflow reaches main.
      # Upload only after successful Chromium acceptance; this packages files and grants no deployment permission.
      - name: Package the verified site for GitHub Pages
        if: success() && matrix.browser == 'chromium'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: dist/web/
          retention-days: 7
      - name: Live browser CORS diagnostic (informational)
        if: always() && matrix.browser == 'chromium'
        continue-on-error: true
        shell: bash
        run: node scripts/browser-network-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failures-${{ matrix.browser }}
          path: test-results
          if-no-files-found: ignore

  browser-memory:
    name: Browser 2 GiB memory acceptance (Chromium)
    runs-on: ubuntu-latest
    # Three attempts may each use the full 600 s test timeout; leave room for install/build as well.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Fixed repeatability gate: a failed attempt must not be hidden by a successful retry.
      - run: npx playwright test tests/e2e/memory.spec.ts --repeat-each=3 --retries=0 --max-failures=1
        env:
          CI: "true"
          UNALTERED_BIG_BROWSER: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-memory-failures
          path: test-results
          if-no-files-found: ignore

  # Firefox and WebKit have no RSS probe, so this checks only that the real 2 GiB file completes in a worker with the
  # correct digest inside the unchanged time limit. It does not evidence the memory ceiling. Slow, so it runs on main
  # and on manual dispatch, not on every pull request; the Chromium job above stays the per-push gate.
  browser-large-file:
    name: Browser 2 GiB completion (${{ matrix.browser }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Match Chromium's budget: three 600 s tests plus browser install/build.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/@playwright/test/cli.js install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: node node_modules/@playwright/test/cli.js test tests/e2e/memory.spec.ts --repeat-each=3 --retries=0 --max-failures=1
        env:
          CI: "true"
          UNALTERED_BIG_BROWSER: "1"
          UNALTERED_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-large-file-failures-${{ matrix.browser }}
          path: test-results
          if-no-files-found: ignore

  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npx playwright test --retries=0
        env:
          CI: "true"
      - name: Windows checksum list for the cross-platform comparison
        shell: bash
        run: cp dist/SHA256SUMS windows-SHA256SUMS
      # The Windows package is opened by its exact name: dist/ also holds the macOS zip, which a wildcard lists first.
      # The check is the Verify-Checksums.ps1 shipped inside it. That script always exits 0 and ends with a Read-Host
      # prompt, so the prompt is stubbed and its printed verdict is judged: every entry OK, then a changed and a missing
      # file reported.
      - name: Verify the Windows zip with the Verify-Checksums.ps1 it ships
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $zip = Get-Item -LiteralPath "dist/unaltered-$version.zip"
          $unz = Join-Path $env:RUNNER_TEMP 'unz'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unz
          $dir = Join-Path $unz "unaltered-$version"
          $shipped = Join-Path $dir 'Verify-Checksums.ps1'
          $entries = @(Get-Content -LiteralPath (Join-Path $dir 'SHA256SUMS') | Where-Object { $_ -ne '' })
          function Read-Host { }
          function Invoke-Shipped { @(& $shipped 6>&1 | ForEach-Object { "$_" }) }
          $out = Invoke-Shipped
          $out | Write-Host
          $ok = @($out | Where-Object { $_ -like 'OK *' }).Count
          if ($entries.Count -lt 1 -or $ok -ne $entries.Count -or $out -notcontains "All files match this folder's SHA256SUMS.") {
            throw "Verify-Checksums.ps1 confirmed $ok of $($entries.Count) files in $($zip.Name)."
          }
          Add-Content -LiteralPath (Join-Path $dir 'README.txt') -Value 'changed'
          Remove-Item -LiteralPath (Join-Path $dir 'LICENSE')
          $out = Invoke-Shipped
          $out | Write-Host
          if ($out -notcontains 'MISMATCH README.txt' -or $out -notcontains 'MISSING  LICENSE' -or $out -contains "All files match this folder's SHA256SUMS.") {
            throw 'Verify-Checksums.ps1 did not report a changed and a missing file.'
          }
          Write-Host "All $($entries.Count) files in $($zip.Name) match its SHA256SUMS, checked by its own Verify-Checksums.ps1."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaltered-windows-build
          path: |
            dist/unaltered-*.html
            dist/unaltered-*.mjs
            dist/unaltered-*.tar.gz
            dist/unaltered-*.zip
            dist/SHA256SUMS
            windows-SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failures-windows
          path: test-results
          if-no-files-found: ignore

  macos:
    name: macOS build, tests, and package checksums
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Verify artefacts and retain macOS checksums
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS
          cp SHA256SUMS ../macos-SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unaltered-macos-build
          path: |
            dist/unaltered-*.html
            dist/unaltered-*.mjs
            dist/unaltered-*.zip
            dist/unaltered-*.tar.gz
            dist/SHA256SUMS
            macos-SHA256SUMS
          if-no-files-found: error

  reproducible-across-platforms:
    name: Linux, Windows, and macOS builds are byte-identical
    needs: [build-test, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unaltered-linux-build
          path: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unaltered-windows-build
          path: windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unaltered-macos-build
          path: macos
      - name: Compare
        run: |
          diff linux/linux-SHA256SUMS windows/windows-SHA256SUMS
          diff linux/linux-SHA256SUMS macos/macos-SHA256SUMS
          cat linux/linux-SHA256SUMS

  differential:
    name: Differential tests against the reference OpenTimestamps client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - name: Offline bundled toolkit regressions (no SDK or services)
        run: python -m unittest discover -s tests/toolkit -p 'test_*.py' -v
      # Dev-only reference client (never shipped). It and its dependencies are pinned by version and wheel SHA-256 in
      # tests/differential/requirements.txt (review record: docs/DEPENDENCIES.md section 7). Wheels only, so no sdist
      # build fetches unpinned build dependencies.
      - name: Install the pinned reference client
        run: |
          python -m venv /tmp/venv && /tmp/venv/bin/pip install --require-hashes --only-binary :all: -r tests/differential/requirements.txt
      # The whole directory, so expected.json (the oracle tests/unit/codec.test.ts trusts) cannot be hand-edited, and
      # a fixture missing on either side fails too.
      - name: Fixtures regenerate byte-identically from the reference implementation
        run: |
          /tmp/venv/bin/python tests/differential/gen_fixtures.py /tmp/fixtures
          diff -r /tmp/fixtures tests/fixtures/ots
      - name: Our parser and serializer against the reference
        run: npx vitest run tests/unit/codec.test.ts
        env:
          UNALTERED_PYTHON: /tmp/venv/bin/python
      - name: Calendar diagnostic against the pinned reference (offline synthetic inputs)
        run: node --test tests/r1/r1-calendars.test.mjs
        env:
          UNALTERED_PYTHON: /tmp/venv/bin/python

  network-check:
    name: Live check of calendars and explorers (CORS and API shape, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check
        shell: bash
        run: node scripts/network-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  # R1 (docs/R1_ACCEPTANCE.md): confirmed upgrade through the app in Chromium plus the reference implementation.
  # Uses an upstream receipt anchored in 2016, so no new calendar submission. Informational like network-check;
  # a separate job so its outcome is visible as a check conclusion.
  r1-acceptance:
    name: R1 confirmed upgrade in the browser plus reference verification (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run
        shell: bash
        run: bash scripts/r1-acceptance.sh | tee -a "$GITHUB_STEP_SUMMARY"
