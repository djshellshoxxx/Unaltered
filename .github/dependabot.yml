version: 2
updates:
  # Dependabot only PROPOSES updates. Every dependency PR must be reviewed by diff
  # (including transitive additions and lockfile integrity hashes). See docs/OPSEC.md §3.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Let new releases age before proposing them, so malicious versions are more likely to be yanked first.
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint 8.x accepts only typescript <6.1, so a TypeScript major breaks `npm ci`.
      # Remove once typescript-eslint supports the next major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
